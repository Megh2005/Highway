<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolkata Roads</title>
<style>
  :root { --ink: #14202b; --muted: #5b6b79; --page-w: 281mm; --page-h: 197mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, Roboto, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #map { position: fixed; inset: 0; background: #e5e9ec; }
  #banner { position: fixed; z-index: 2000; top: 70px; left: 50%; transform: translateX(-50%); max-width: min(560px, 92vw);
    padding: 10px 14px; background: #fff3cd; border: 1px solid #b45309; border-radius: 3px; font-size: 13px; }

  .box { background: rgba(255,255,255,.95); border: 1px solid #333; margin: 10px; }
  .legend { padding: 5px 8px 4px; font-size: 10px; line-height: 1.5; color: #111; max-height: 55vh; overflow: auto; }
  .legend h4 { margin: 0 0 2px; padding-bottom: 2px; border-bottom: 1px solid #999; font-size: 10.5px; }
  .legend div { white-space: nowrap; }
  .legend i { display: inline-block; width: 18px; height: 4px; margin-right: 5px; vertical-align: middle; }
  .north { padding: 2px 7px 0; text-align: center; font: 700 11px/1.1 "Segoe UI", sans-serif; }
  .north svg { display: block; margin: 0 auto; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px; border-radius: 3px; max-width: calc(100vw - 90px); }
  button, select, input { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid #555; border-radius: 2px; background: #fff; color: var(--ink); }
  button { cursor: pointer; font-weight: 600; }
  .primary { background: var(--ink); color: #fff; }
  .toolbar span { font-size: 11px; color: var(--muted); }
  :focus-visible { outline: 2px solid #2563eb; }

  .info { min-width: 260px; font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  .info table { border-collapse: collapse; width: 100%; }
  .info td { padding: 3px 0; vertical-align: top; }
  .info td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  .info .note { color: #b45309; }
  .info a { color: #1d4ed8; }
  .info .actions { margin-top: 8px; display: flex; gap: 6px; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

  .panel { display: none; position: fixed; z-index: 1200; top: 52px; left: 10px; width: min(330px, calc(100vw - 20px)); margin: 0;
    max-height: calc(100vh - 70px); overflow: auto; padding: 10px; border-radius: 3px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .panel.open { display: block; }
  .panel h4 { margin: 0 0 8px; font-size: 14px; }
  .panel input { width: 100%; }
  .panel input[type=color] { height: 28px; padding: 1px; }
  .panel label { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .panel .row { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
  .panel small { color: var(--muted); }
  .panel > small { display: block; margin-top: 8px; }
  #p-msg { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #p-msg.err { color: #b91c1c; }
  #fields { display: none; }
  #fields.show { display: block; }
  #results { list-style: none; margin: 2px 0 0; padding: 0; max-height: 220px; overflow: auto; border: 1px solid #bbb; background: #fff; }
  #results:empty { display: none; }
  #results li { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #eee; }
  #results li:hover, #results li:focus { background: #eef3fb; outline: none; }
  #results li small { margin-left: 6px; }

  body.print-mode { height: auto; }
  body.print-mode #map { position: relative; inset: auto; width: var(--page-w); height: var(--page-h); border: 1px solid #000; }
  body.print-mode .toolbar, body.print-mode .panel, body.print-mode #banner, body.print-mode .gm-bundled-control { display: none !important; }
</style>
<style id="page-rule"></style>
</head>

<body>
<div id="map" aria-label="Map of Kolkata roads"></div>

<div class="box panel" id="panel">
  <h4 id="p-title">Add highway</h4>
  <input id="q" type="search" placeholder="Search Kolkata highway, e.g. Bose, Bypass, Park" autocomplete="off" aria-label="Search highway">
  <ul id="results"></ul>
  <div id="p-msg"></div>
  <div id="fields">
    <label>Code<input id="f-code"></label>
    <label>Name<input id="f-name"></label>
    <label>Colour<input id="f-color" type="color"></label>
    <label>Start point<input id="f-s"></label>
    <label>End point<input id="f-e"></label>
    <small>Start (S) and end (E) are marked automatically. Drag either marker to adjust it.</small>
    <div class="row"><button id="f-swap">Swap S / E</button><button id="f-cancel">Cancel</button><button id="f-save" class="primary">Save highway</button></div>
  </div>
  <div class="row" id="only-cancel"><button id="f-cancel2">Close</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, setDoc, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

/* =====================================================================
   1. CONFIGURATION  (the Google Maps key is read from /api/config, see api/config.js)
   ===================================================================== */
const CONFIG = {
  highwayBounds: { west: 88.20, north: 22.80, east: 88.50, south: 22.40 },   // Kolkata search area
  palette: ['#DB2777', '#0891B2', '#65A30D', '#7C3AED', '#EA580C', '#0F766E', '#BE123C', '#4338CA', '#A16207', '#475569'],
  labelPositions: [0.5],
  fitPadding: 50,
  paperMm: { A4: [210, 297], A3: [297, 420], A2: [420, 594], Letter: [216, 279] },
  printMarginMm: 6,
  deviationRatio: 1.8
};

const firebaseConfig = {
  apiKey: "AIzaSyBUBi_4O2qIGqDKje1gH5OvaZA4AT0oS_M",
  authDomain: "zero-ops-citadel.firebaseapp.com",
  projectId: "zero-ops-citadel",
  storageBucket: "zero-ops-citadel.firebasestorage.app",
  messagingSenderId: "705456952090",
  appId: "1:705456952090:web:78b3965a48d23073fd92a3"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COLLECTION = 'highways';

const ROADS = [
  { c: 'R1',  n: 'E. M. Bypass',             kn: 'Navy blue',   k: '#1A365D', s: 'Ultadanga crossing',            sc: [22.591411, 88.393388], e: 'Kamalgazi crossing',           ec: [22.449438, 88.390871] },
  { c: 'R2',  n: 'A. J. C. Bose Road',       kn: 'Red',         k: '#C53030', s: 'Hastings (Strand Rd. Junction)', sc: [22.571021, 88.343134], e: 'Sealdah Railway Station',      ec: [22.567775, 88.371010] },
  { c: 'R3',  n: 'A. P. C. Road',            kn: 'Dark green',  k: '#22543D', s: 'Shyambazar 5 Point Crossing',   sc: [22.601965, 88.373761], e: 'Sealdah Railway Station',      ec: [22.567775, 88.371010] },
  { c: 'R4',  n: 'Rashbehari Avenue',        kn: 'Orange',      k: '#C05621', s: 'Chetla',                        sc: [22.521088, 88.372279], e: 'Ruby Crossing',                ec: [22.513390, 88.401830] },
  { c: 'R5',  n: 'Diamond Harbour Road',     kn: 'Purple',      k: '#6B46C1', s: 'Kidderpore',                    sc: [22.536323, 88.316654], e: 'Joka',                         ec: [22.453655, 88.302345] },
  { c: 'R6',  n: 'B. T. Road',               kn: 'Teal',        k: '#0D9488', s: 'Shyambazar 5pt Crossing',       sc: [22.601965, 88.373761], e: 'Barrackpore',                  ec: [22.761660, 88.366193] },
  { c: 'R7',  n: 'VIP Road',                 kn: 'Magenta',     k: '#9D174D', s: 'Ultadanga VIP Crossing',        sc: [22.591436, 88.393372], e: 'Airport Gate-1',               ec: [22.643113, 88.431225] },
  { c: 'R8',  n: 'Park Street',              kn: 'Olive green', k: '#4D7C0F', s: 'Esplanade',                     sc: [22.555232, 88.350087], e: 'Park Circus 7 Point crossing', ec: [22.543295, 88.366006] },
  { c: 'R9',  n: 'Jessore Road',             kn: 'Amber',       k: '#B45309', s: 'Shyambazar 5 Point Crossing',   sc: [22.601965, 88.373761], e: 'Airport Gate 1',               ec: [22.643113, 88.431225] },
  { c: 'R10', n: 'Prince Anwar Shah Road',   kn: 'Blue',        k: '#2563EB', s: 'Mahanayak Uttam Kumar Metro',   sc: [22.494690, 88.345175], e: 'Kalikapur Connector',          ec: [22.504348, 88.400825] },
  { c: 'R11', n: 'Gariahat Road',            kn: 'Brown',       k: '#78350F', s: 'Ballygunge Phari',              sc: [22.528291, 88.365932], e: 'Jadavpur Police Station',      ec: [22.502913, 88.367744] },
  { c: 'R12', n: 'J. B. S. Haldane Avenue',  kn: 'Slate grey',  k: '#374151', s: 'Park Circus',                   sc: [22.541490, 88.384097], e: 'Dhapa',                        ec: [22.542827, 88.398010] }
];

/* =====================================================================
   2. HELPERS
   ===================================================================== */
let toolbar = null;   // Google adds map controls to the page late, so the toolbar is also searched while detached
const $ = (selector) => document.querySelector(selector) || toolbar?.querySelector(selector);
const fmtCoord = (p) => p[0].toFixed(5) + ', ' + p[1].toFixed(5);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toObj = (p) => ({ lat: p[0], lng: p[1] });
const toArr = (o) => [o.lat, o.lng];
const toLL = toObj;

function banner(text) {
  let b = $('#banner');
  if (!b) { b = document.createElement('div'); b.id = 'banner'; document.body.appendChild(b); }
  b.textContent = text;
}
const darken = (hex, f = 0.6) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(hex.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');

function dist(a, b) {                                   // metres, haversine
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(h));
}
function pointAlong(path, f) {
  const cum = [0];
  for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + dist(path[i - 1], path[i]));
  const target = cum[cum.length - 1] * f;
  let i = 1;
  while (i < cum.length - 1 && cum[i] < target) i++;
  const u = (target - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
  return [path[i - 1][0] + (path[i][0] - path[i - 1][0]) * u, path[i - 1][1] + (path[i][1] - path[i - 1][1]) * u];
}
function segDist(p, a, b) {                             // distance from point p to segment a-b (degrees, local plane)
  const k = Math.cos(p[0] * Math.PI / 180), f = (q) => [q[0], q[1] * k];
  const [P, A, B] = [f(p), f(a), f(b)], dx = B[0] - A[0], dy = B[1] - A[1];
  const t = Math.max(0, Math.min(1, ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / (dx * dx + dy * dy || 1)));
  return Math.hypot(P[0] - A[0] - t * dx, P[1] - A[1] - t * dy);
}

/* =====================================================================
   3. LOAD GOOGLE MAPS
   ===================================================================== */
let googleMapsKey = '';
try { googleMapsKey = (await (await fetch('/api/config', { cache: 'no-store' })).json()).googleMapsKey || ''; } catch (_) {}
if (!googleMapsKey) {
  banner('Google Maps key not found. Add GOOGLE_MAPS_API_KEY under Environment Variables in your Vercel project, then redeploy.');
  throw new Error('Missing Google Maps API key');
}
window.gm_authFailure = () => banner('Google Maps rejected the API key. Check that billing is on, the key allows this website, and the Maps JavaScript, Places (New), Routes and Geocoding APIs are enabled.');
await new Promise((resolve, reject) => {
  window.__gmReady = resolve;
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(googleMapsKey)}&v=weekly&loading=async&region=IN&callback=__gmReady`;
  script.onerror = () => { banner('Could not load Google Maps. Check your internet connection.'); reject(new Error('Google Maps failed to load')); };
  document.head.appendChild(script);
});
const [{ Map: GMap, Polyline, InfoWindow }, { Marker }, { Size, Point }, { Route }, { Geocoder }, { AutocompleteSuggestion, AutocompleteSessionToken }] =
  await Promise.all(['maps', 'marker', 'core', 'routes', 'geocoding', 'places'].map((lib) => google.maps.importLibrary(lib)));

/* =====================================================================
   4. MAP + CONTROLS
   ===================================================================== */
const map = new GMap($('#map'), {
  center: { lat: 22.55, lng: 88.37 }, zoom: 12, minZoom: 9, maxZoom: 19,
  mapTypeControl: false, streetViewControl: false, fullscreenControl: false, scaleControl: true, clickableIcons: false,
  gestureHandling: 'greedy',
  styles: [{ stylers: [{ saturation: -65 }, { lightness: 8 }] }, { featureType: 'poi', stylers: [{ visibility: 'off' }] }]
});
const iw = new InfoWindow({ maxWidth: 340 });

function addControl(position, el) { map.controls[google.maps.ControlPosition[position]].push(el); return el; }
const el = (tag, cls, html) => { const e = document.createElement(tag); e.className = cls; e.innerHTML = html || ''; return e; };

const legendEl = addControl('BOTTOM_LEFT', el('div', 'box legend'));
function renderLegend() {
  legendEl.innerHTML = '<h4>Legend</h4>' + ROADS.map((r) => `<div><i style="background:${r.k}"></i><b>${esc(r.c)}</b> ${esc(r.n)}</div>`).join('');
}
addControl('TOP_RIGHT', el('div', 'box north', '<svg width="18" height="26" viewBox="0 0 18 26"><path d="M9 1 16 24 9 18 2 24Z" fill="#111"/></svg>N'));
toolbar = addControl('TOP_LEFT', el('div', 'box toolbar',
  '<button id="btn-add" title="Add a new highway">+ Add highway</button>' +
  '<button id="btn-print" class="primary" title="Print or save as PDF">Print</button>' +
  '<select id="paper" aria-label="Paper size">' + Object.keys(CONFIG.paperMm).map((p) => `<option>${p}</option>`).join('') + '</select>' +
  '<select id="orient" aria-label="Orientation"><option value="l">Landscape</option><option value="p">Portrait</option></select>' +
  '<button id="btn-fit" title="Fit all roads">Fit</button><span id="status"></span>'));

/* ---------- crisp SVG icons (sharp at any print size) ---------- */
const svgIcon = (svg, w, h) => ({ url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new Size(w, h), anchor: new Point(w / 2, h / 2) });
const endIcon = (letter, color, size) => {
  const r = size / 2;
  return svgIcon(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r - 1.5}" fill="#fff" stroke="${color}" stroke-width="${size > 16 ? 3 : 2}"/><text x="${r}" y="${r}" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-weight="700" font-size="${size * .56}" fill="${color}">${letter}</text></svg>`, size, size);
};
const labelIcon = (code, color, angle) => svgIcon(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><text transform="rotate(${angle} 32 32)" x="32" y="25" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-weight="700" font-size="10" fill="${color}" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${esc(code)}</text></svg>`, 64, 64);

/* =====================================================================
   5. ROUTING  (Google Routes follows the real street network)
   ===================================================================== */
async function fetchRoute(road) {
  const waypoints = [road.sc, ...(road.v || []), road.ec];
  const cacheKey = 'kolkata-gm:' + road.c + JSON.stringify(waypoints);
  try { const cached = JSON.parse(localStorage.getItem(cacheKey)); if (cached) return cached; } catch (_) {}
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const { routes } = await Route.computeRoutes({
        origin: toLL(road.sc), destination: toLL(road.ec), intermediates: (road.v || []).map(toLL),
        travelMode: 'DRIVING', fields: ['path', 'distanceMeters', 'durationMillis']
      });
      const r = routes[0];
      const result = { path: r.path.map((p) => [p.lat, p.lng]), distance: r.distanceMeters, duration: r.durationMillis / 1000 };
      try { localStorage.setItem(cacheKey, JSON.stringify(result)); } catch (_) {}
      return result;
    } catch (_) { await sleep(800); }
  }
  throw new Error('Routing failed for ' + road.c);
}

/* =====================================================================
   6. DRAWING + ROAD LIST
   ===================================================================== */
let selected = null, draft = null, pending = 0, dbNote = '', firstLoad = true, queue = Promise.resolve();

function setHighlight(road, on) {
  if (!road.line) return;
  road.line.setOptions({ strokeWeight: on ? 5 : 3, zIndex: on ? 12 : 2 });
  road.outline.setOptions({ strokeWeight: on ? 8 : 5.5, zIndex: on ? 11 : 1 });
}

function drawRoad(road, path, isStraightLine) {
  (road.group || []).forEach((o) => o.setMap(null));
  road.group = [];
  road.path = path;
  road.isStraightLine = isStraightLine;
  const pts = path.map(toLL), add = (o) => { o.addListener('click', (e) => selectRoad(road, e.latLng)); road.group.push(o); return o; };
  const stroke = { path: pts, map, strokeOpacity: 1 };

  road.outline = add(new Polyline({ ...stroke, strokeColor: darken(road.k), strokeWeight: 5.5, zIndex: 1 }));
  road.line    = add(new Polyline({ ...stroke, strokeColor: road.k, strokeWeight: 3, zIndex: 2 }));

  [['Start', 'S', path[0], road.s], ['End', 'E', path[path.length - 1], road.e]].forEach(([label, letter, point, name]) =>
    add(new Marker({ position: toLL(point), map, icon: endIcon(letter, road.k, 14), zIndex: 500, title: `${road.c} ${label}: ${name}` })));

  CONFIG.labelPositions.forEach((f) => {
    const a = pointAlong(path, Math.max(f - 0.015, 0)), b = pointAlong(path, Math.min(f + 0.015, 1));
    let angle = Math.atan2(-(b[0] - a[0]), (b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180)) * 180 / Math.PI;
    if (angle > 90 || angle < -90) angle += 180;        // keep text upright
    add(new Marker({ position: toLL(pointAlong(path, f)), map, icon: labelIcon(road.c, road.k, angle), zIndex: 400, title: `${road.c} · ${road.n}` }));
  });
  if (selected === road) setHighlight(road, true);
}

function boundsOf(points) {                              // plain bounds object, no Google class needed
  let south = 90, north = -90, west = 180, east = -180;
  for (const [lat, lng] of points) { south = Math.min(south, lat); north = Math.max(north, lat); west = Math.min(west, lng); east = Math.max(east, lng); }
  return { south, north, west, east };
}
function fitAll() { map.fitBounds(boundsOf(ROADS.flatMap((r) => r.path)), CONFIG.fitPadding); }

function setStatus() {
  $('#status').textContent = dbNote || (pending ? `Routing ${pending} left…` :
    ROADS.some((r) => r.isStraightLine) ? 'Routing failed for some roads – is the Routes API enabled?' : '');
}

function enqueue(road) {                                 // one at a time, so the quota is not hit
  pending++; setStatus();
  queue = queue.then(async () => {
    if (ROADS.includes(road)) {
      try { const rt = await fetchRoute(road); road.distance = rt.distance; road.duration = rt.duration; drawRoad(road, rt.path, false); }
      catch (_) { drawRoad(road, [road.sc, road.ec], true); }
    }
    pending--; setStatus();
    if (firstLoad && !selected && pending % 4 === 0) fitAll();
    if (!pending) firstLoad = false;
  });
}

function addRoad(road) { road.group = []; road.path = [road.sc, road.ec]; ROADS.push(road); enqueue(road); }
function removeRoad(road) {
  if (selected === road) selected = null;
  iw.close();
  (road.group || []).forEach((o) => o.setMap(null));
  ROADS.splice(ROADS.indexOf(road), 1);
}

/* =====================================================================
   7. ROAD DETAILS (click)
   ===================================================================== */
function selectRoad(road, at) {
  if (selected && selected !== road) setHighlight(selected, false);
  selected = road;
  setHighlight(road, true);

  const row = (label, value) => `<tr><td>${label}</td><td>${value}</td></tr>`;
  const deviates = road.distance && road.distance / dist(road.sc, road.ec) > CONFIG.deviationRatio;
  const link = `https://www.google.com/maps/dir/?api=1&origin=${road.sc}&destination=${road.ec}`;

  const head = el('div', '', `${esc(road.c)} · ${esc(road.n)}`);
  head.style.cssText = `color:${road.k};font:700 15px "Segoe UI",sans-serif`;
  iw.setHeaderContent(head);
  iw.setContent(`<div class="info"><table>` +
    row('Road code', `<b>${esc(road.c)}</b>`) +
    row('Colour', `<span class="swatch" style="background:${road.k}"></span>${esc(road.kn)} (${road.k})`) +
    row('Start', `${esc(road.s)}<br><small>${fmtCoord(road.sc)}</small>`) +
    row('End', `${esc(road.e)}<br><small>${fmtCoord(road.ec)}</small>`) +
    row('Length', road.distance ? (road.distance / 1000).toFixed(1) + ' km' : '–') +
    row('Drive time', road.duration ? '≈ ' + Math.round(road.duration / 60) + ' min (no traffic)' : '–') +
    row('Path', road.isStraightLine ? 'Straight line (routing unavailable)' : 'Routed along the street network') +
    (deviates ? row('Check', '<span class="note">Routed path is much longer than the straight distance – verify the coordinates or add via-points.</span>') : '') +
    `</table><a href="${link}" target="_blank" rel="noopener">Open in Google Maps</a>` +
    (road.custom ? '<div class="actions"><button id="edit-road">Edit</button><button id="del-road">Delete</button></div>' : '') + '</div>');
  iw.setPosition(at || toLL(pointAlong(road.path, 0.5)));
  google.maps.event.addListenerOnce(iw, 'domready', () => {
    $('#edit-road')?.addEventListener('click', () => openPanel(road));
    $('#del-road')?.addEventListener('click', async () => {
      if (!confirm(`Delete ${road.c} · ${road.n}?`)) return;
      try { await deleteDoc(doc(db, COLLECTION, road.id)); } catch (err) { alert('Could not delete: ' + err.message); }
    });
  });
  iw.open({ map });
}
map.addListener('click', () => { if (selected) { setHighlight(selected, false); selected = null; } iw.close(); });

/* =====================================================================
   8. FIRESTORE SYNC  (custom highways appear on every device in real time)
   ===================================================================== */
const sig = (r) => JSON.stringify([r.c, r.n, r.k, r.s, r.e, r.sc, r.ec, r.v]);
const fromDoc = (d) => {
  const x = d.data();
  return { id: d.id, custom: true, c: x.c, n: x.n, kn: x.kn || 'Custom', k: x.k, s: x.s, e: x.e,
    sc: toArr(x.sc), ec: toArr(x.ec), v: (x.v || []).map(toArr) };
};
onSnapshot(collection(db, COLLECTION), (snap) => {
  dbNote = '';
  const ids = new Set(snap.docs.map((d) => d.id));
  ROADS.filter((r) => r.custom && !ids.has(r.id)).forEach(removeRoad);
  snap.docs.forEach((d) => {
    const next = fromDoc(d), old = ROADS.find((r) => r.id === next.id);
    if (old) { if (sig(old) === sig(next)) return; removeRoad(old); }
    addRoad(next);
  });
  renderLegend(); setStatus();
}, (err) => { dbNote = err.code === 'permission-denied' ? 'Database: permission denied – check Firestore rules' : 'Database error: ' + err.message; setStatus(); });

/* =====================================================================
   9. ADD / EDIT HIGHWAY  (Google Places search → start & end marked automatically)
   ===================================================================== */
let draftObjs = [], token = new AutocompleteSessionToken();
const nextCode = () => 'R' + (Math.max(0, ...ROADS.map((r) => parseInt(String(r.c).replace(/\D/g, '')) || 0)) + 1);
const nextColor = () => CONFIG.palette.find((c) => !ROADS.some((r) => r.k.toLowerCase() === c.toLowerCase())) || '#000000';
const markerPos = (m) => [m.getPosition().lat(), m.getPosition().lng()];
function setMsg(text, isError) { const m = $('#p-msg'); m.textContent = text || ''; m.className = isError ? 'err' : ''; }
function clearDraft() { draftObjs.forEach((o) => o.setMap(null)); draftObjs = []; }

function draftMarker(letter, pos, name) {
  const m = new Marker({ position: toLL(pos), map, draggable: true, icon: endIcon(letter, '#000000', 26), zIndex: 1500, title: name + ' – drag to adjust' });
  m.addListener('dragend', () => { if (draft) draft.via = []; });   // moved by hand: the old via-point no longer applies
  draftObjs.push(m);
  return m;
}

function showDraft(sc, ec, via, path) {
  clearDraft();
  draft.via = via || [];
  draft.line = path ? new Polyline({ path: path.map(toLL), map, strokeColor: $('#f-color').value, strokeWeight: 6, strokeOpacity: .55, clickable: false, zIndex: 900 }) : null;
  if (draft.line) draftObjs.push(draft.line);
  draft.mS = draftMarker('S', sc, 'Start');
  draft.mE = draftMarker('E', ec, 'End');
  $('#fields').classList.add('show');
  $('#only-cancel').style.display = 'none';
  map.fitBounds(boundsOf([sc, ec, ...(path || [])]), 70);
}

function openPanel(road) {
  closePanel();
  iw.close();
  draft = { id: road?.id || null };
  $('#p-title').textContent = road ? `Edit ${road.c} · ${road.n}` : 'Add highway';
  $('#q').style.display = road ? 'none' : '';
  $('#panel').classList.add('open');
  $('#only-cancel').style.display = '';
  if (road) {
    $('#f-code').value = road.c; $('#f-name').value = road.n; $('#f-color').value = road.k;
    $('#f-s').value = road.s; $('#f-e').value = road.e;
    showDraft(road.sc, road.ec, road.v, road.path);
  } else { $('#q').focus(); }
}
function closePanel() {
  clearDraft(); draft = null;
  $('#panel').classList.remove('open'); $('#fields').classList.remove('show');
  $('#results').innerHTML = ''; $('#q').value = ''; setMsg('');
}

/* --- autocomplete: Google Places, roads only, inside Kolkata --- */
let searchTimer = 0, searchSeq = 0;
$('#q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const text = $('#q').value.trim(), list = $('#results');
  if (text.length < 2) { list.innerHTML = ''; setMsg(''); return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    setMsg('Searching…');
    try {
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input: text, sessionToken: token, includedPrimaryTypes: ['route'], region: 'in', locationRestriction: CONFIG.highwayBounds
      });
      if (seq !== searchSeq) return;
      list.innerHTML = '';
      suggestions.filter((s) => s.placePrediction).slice(0, 8).forEach((s) => {
        const p = s.placePrediction, li = document.createElement('li');
        li.tabIndex = 0;
        li.innerHTML = `${esc(p.mainText.text)}<small>${esc(p.secondaryText?.text || '')}</small>`;
        li.onclick = () => pickHighway(p);
        li.onkeydown = (e) => { if (e.key === 'Enter') pickHighway(p); };
        list.appendChild(li);
      });
      setMsg(list.children.length ? '' : 'No highway found. Try a shorter name.');
    } catch (err) { if (seq === searchSeq) setMsg('Search failed. Check that Places API (New) is enabled for your key.', true); console.error(err); }
  }, 300);
});

async function placeName(p, fallback) {
  try {
    const { results } = await new Geocoder().geocode({ location: toLL(p) });
    const parts = results[0].address_components;
    for (const t of ['neighborhood', 'sublocality_level_2', 'sublocality_level_1', 'locality']) {
      const part = parts.find((x) => x.types.includes(t));
      if (part) return part.long_name;
    }
  } catch (_) {}
  return fallback;
}

async function pickHighway(prediction) {
  const name = prediction.mainText.text;
  $('#results').innerHTML = ''; $('#q').value = name;
  setMsg('Locating the road and its start and end points…');
  try {
    const place = prediction.toPlace();
    await place.fetchFields({ fields: ['location', 'viewport'] });
    token = new AutocompleteSessionToken();
    const vp = place.viewport;
    if (!vp) throw new Error('No extent');
    const loc = [place.location.lat(), place.location.lng()];
    const sw = [vp.getSouthWest().lat(), vp.getSouthWest().lng()], ne = [vp.getNorthEast().lat(), vp.getNorthEast().lng()];
    const nw = [ne[0], sw[1]], se = [sw[0], ne[1]];
    // the road runs along the diagonal of its extent that passes closest to the road's own point
    const [a, b] = segDist(loc, sw, ne) <= segDist(loc, nw, se) ? [sw, ne] : [nw, se];
    const probe = { c: 'draft', sc: a, ec: b, v: [loc] };
    let path;
    try { path = (await fetchRoute(probe)).path; } catch (_) { path = [a, loc, b]; }
    const first = path[0], last = path[path.length - 1];
    const [start, end] = first[0] >= last[0] ? [first, last] : [last, first];     // start = northern end
    $('#f-code').value = nextCode(); $('#f-name').value = name; $('#f-color').value = nextColor();
    showDraft(start, end, [loc], path);
    setMsg('Naming start and end…');
    [$('#f-s').value, $('#f-e').value] = await Promise.all([placeName(start, 'Start'), placeName(end, 'End')]);
    setMsg('');
  } catch (err) { console.error(err); setMsg('Could not load that road. Try another result.', true); }
}

$('#f-color').addEventListener('input', () => draft?.line?.setOptions({ strokeColor: $('#f-color').value }));
$('#f-swap').onclick = () => {
  if (!draft?.mS) return;
  const s = draft.mS.getPosition(), e = draft.mE.getPosition();
  draft.mS.setPosition(e); draft.mE.setPosition(s);
  [$('#f-s').value, $('#f-e').value] = [$('#f-e').value, $('#f-s').value];
};
$('#f-cancel').onclick = $('#f-cancel2').onclick = closePanel;
$('#btn-add').onclick = () => openPanel(null);

$('#f-save').onclick = async () => {
  if (!draft?.mS) return;
  const c = $('#f-code').value.trim(), n = $('#f-name').value.trim();
  if (!c || !n) return setMsg('Enter a road code and a name.', true);
  if (ROADS.some((r) => r.c === c && r.id !== draft.id)) return setMsg(`The code ${c} is already used.`, true);
  const data = { c, n, k: $('#f-color').value, kn: 'Custom', s: $('#f-s').value.trim() || 'Start', e: $('#f-e').value.trim() || 'End',
    sc: toObj(markerPos(draft.mS)), ec: toObj(markerPos(draft.mE)), v: draft.via.map(toObj) };
  setMsg('Saving…');
  try {
    if (draft.id) await setDoc(doc(db, COLLECTION, draft.id), data); else await addDoc(collection(db, COLLECTION), data);
    closePanel();
  } catch (err) { setMsg('Could not save: ' + err.message, true); }
};

/* =====================================================================
   10. PRINT  (map fills the whole page on the chosen paper)
   ===================================================================== */
function applyPageSize() {
  const [a, b] = CONFIG.paperMm[$('#paper').value];
  const landscape = $('#orient').value === 'l';
  const w = landscape ? b : a, h = landscape ? a : b, m = CONFIG.printMarginMm;
  $('#page-rule').textContent = `@page { size: ${w}mm ${h}mm; margin: ${m}mm }`;
  document.documentElement.style.setProperty('--page-w', (w - 2 * m) + 'mm');
  document.documentElement.style.setProperty('--page-h', (h - 2 * m - 1) + 'mm');
}
function enterPrintMode() {
  document.body.classList.add('print-mode');
  applyPageSize(); iw.close();
  google.maps.event.trigger(map, 'resize'); fitAll();
}
function leavePrintMode() { document.body.classList.remove('print-mode'); google.maps.event.trigger(map, 'resize'); }

$('#btn-print').onclick = async () => {
  const button = $('#btn-print');
  enterPrintMode();
  button.textContent = 'Preparing…';
  await new Promise((resolve) => { google.maps.event.addListenerOnce(map, 'idle', resolve); setTimeout(resolve, 3000); });
  await sleep(800);
  button.textContent = 'Print';
  window.print();
};
window.addEventListener('beforeprint', () => { if (!document.body.classList.contains('print-mode')) enterPrintMode(); });
window.addEventListener('afterprint', leavePrintMode);
$('#paper').onchange = $('#orient').onchange = applyPageSize;
$('#btn-fit').onclick = fitAll;
applyPageSize();

/* =====================================================================
   11. START-UP
   ===================================================================== */
const builtIn = ROADS.splice(0);
builtIn.forEach(addRoad);
renderLegend();
fitAll();
</script>
</body>
